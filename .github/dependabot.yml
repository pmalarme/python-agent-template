# Dependabot version updates. See:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Note: the `github/gh-aw-actions/**` ignore rule under the `github-actions`
# ecosystem is managed by `gh aw compile` and will be re-added if removed.
# Do not pass `--dependabot` / `--force` to `gh aw compile`; see
# `.github/instructions/agentic-workflows.instructions.md`.
updates:
- directory: /
  labels:
  - python
  - dependencies
  package-ecosystem: pip
  schedule:
    day: sunday
    interval: weekly
- directory: /
  labels:
  - python
  - dependencies
  package-ecosystem: uv
  schedule:
    day: sunday
    interval: weekly
- directory: /
  ignore:
  - dependency-name: "github/gh-aw-actions/**" # Managed by gh aw compile. Version-locked to the gh-aw compiler; do not bump.
  labels:
  - github-actions
  - dependencies
  package-ecosystem: github-actions
  schedule:
    day: sunday
    interval: weekly
version: 2
